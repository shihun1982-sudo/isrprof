<title>ISR Profiler</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: control strip, then a vertical stack sharing one time axis:
   SW structure -> SW touch timeline -> 3D timing graph (+ call graph / details) -> HW control timeline -> HW block cards.
   A second tab holds the Structure101-style views. */
:root {
  --bg: #f4f4f1; --panel: #ffffff; --panel-2: #f9f9f6; --fg: #17171a; --muted: #67665f; --line: #dcdad2;
  --line-strong: #bdbbb1; --accent: #2a78d6; --accent-soft: #dce9fa;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --read: #2a78d6; --write: #eb6834;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --shadow: 0 1px 2px rgba(23,23,26,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1d1d1b; --panel-2: #232321; --fg: #ecebe6; --muted: #a4a39b; --line: #33332f;
    --line-strong: #4a4944; --accent: #3987e5; --accent-soft: #1d3250; --read: #3987e5; --write: #d95926;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1d1d1b; --panel-2: #232321; --fg: #ecebe6; --muted: #a4a39b; --line: #33332f;
  --line-strong: #4a4944; --accent: #3987e5; --accent-soft: #1d3250; --read: #3987e5; --write: #d95926;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 13px; line-height: 1.45; margin: 0; padding-block: 0 8px; padding-inline: 8px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
button, select, input { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 12px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding-block: 3px 2px; border-bottom: 1px solid var(--line); }
.top h1 { font-size: 14px; letter-spacing: -0.01em; }
.top .sub { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 3px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 11px; line-height: 17px; white-space: nowrap; }
.chip b { font-weight: 500; font-family: var(--mono); font-size: 10.5px; }
.tabs { margin-left: auto; display: flex; gap: 4px; }
.tabs button { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 9px; cursor: pointer; color: var(--muted); font-size: 12px; }
.tabs button[aria-selected="true"] { background: var(--panel); border-color: var(--line); color: var(--fg); box-shadow: var(--shadow); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; padding-block: 2px; }
.controls .group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.controls label { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; }
.controls .info { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
.tog { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 1px 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; line-height: 17px; }
.tog[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tog .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
select.tog { padding-block: 3px; }
input[type="range"] { vertical-align: middle; width: 80px; accent-color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-top: 4px; box-shadow: var(--shadow); }
.panel > summary { cursor: pointer; padding: 3px 10px; font-weight: 600; display: flex; align-items: center; gap: 10px; list-style: none; flex-wrap: nowrap; min-height: 22px; font-size: 12.5px; }
.panel > summary::-webkit-details-marker { display: none; }
.panel > summary::before { content: "▾"; color: var(--muted); font-size: 11px; width: 10px; }
.panel:not([open]) > summary::before { content: "▸"; }
.panel > summary .hint { color: var(--muted); font-weight: 400; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.panel > summary:hover .hint { white-space: normal; overflow: visible; }
.panel .body { padding: 4px 8px 8px; }
.stack-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 8px var(--side-w, 380px); gap: 4px; margin-top: 4px; align-items: start; }
@media (max-width: 1000px) { .stack-wrap { grid-template-columns: 1fr; } }
.stack { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.stack .panel { margin-top: 0; }
.stack .panel .body.strip { padding: 4px 0 2px; }
.strip .hint { padding-left: 8px; }
.panel.ctl { margin-top: 2px; }
.panel.ctl > summary { padding: 1px 8px; min-height: 18px; font-size: 11.5px; }
.panel.ctl > summary .hint { display: none; }
.panel.ctl > summary:hover .hint { display: inline; }
.panel.ctl .body.controls { padding: 0 8px 3px; }
.stack .panel .body.scene-body { padding: 0; }
#scene { position: relative; height: 640px; background: var(--panel); border: 0; border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; overflow: hidden; touch-action: none; }
#scene canvas { display: block; }
#scene .ovw { position: absolute; top: 4px; height: 14px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
#scene .ovw svg { display: block; }
#scene .legend { position: absolute; left: 10px; bottom: 6px; right: 10px; display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11px; line-height: 1.3; color: var(--muted); pointer-events: none; }
#scene .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
#scene .axes { position: absolute; left: 10px; top: 6px; right: 330px; font-size: 11px; color: var(--muted); font-family: var(--mono); pointer-events: none; }
#scene .views { position: absolute; right: 8px; bottom: 44px; display: flex; gap: 4px; }
#scene .views button { font-size: 11.5px; padding: 2px 8px; }
#scene .nogl { padding: 8px 0; color: var(--muted); }
aside#side { position: sticky; top: 4px; display: flex; flex-direction: column; gap: 0; min-width: 0; height: calc(100vh - 8px); }
aside#side > details.panel { display: flex; flex-direction: column; min-height: 0; margin: 0; }
aside#side > details.panel:not([open]) { flex: 0 0 auto; }
#tree-panel[open] { flex: 0 0 var(--tree-h, 48%); }
#detail-panel[open] { flex: 1 1 0; }
aside#side > details.panel > .body { flex: 1 1 0; min-height: 0; overflow: auto; }
#tree, #detail { height: auto !important; max-height: none; overflow: visible; }
#hsplit { height: 9px; margin: 2px 10px; border-radius: 4px; cursor: ns-resize; display: flex; align-items: center; justify-content: center; touch-action: none; flex: 0 0 auto; }
#hsplit i { display: block; width: 44px; height: 3px; border-radius: 2px; background: var(--line-strong); }
#hsplit:hover, #hsplit.on { background: var(--accent-soft); } #hsplit:hover i, #hsplit.on i { background: var(--accent); }
aside#side .panel { margin-top: 0; }
#tree, #detail { overflow: auto; min-width: 0; }
#tree { max-height: 46vh; }
#detail { max-height: 44vh; }
#side h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.tree ul { list-style: none; margin: 0; padding-left: 14px; }
.tree > ul { padding-left: 0; }
.tree li { margin: 1px 0; }
.tree .row { display: flex; align-items: center; gap: 5px; padding: 1px 4px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.tree .row:hover { background: var(--panel-2); }
.tree .row.sel { background: var(--accent-soft); }
.tree .row.dim { opacity: .4; }
.tree .car { width: 12px; color: var(--muted); font-size: 10px; text-align: center; flex: none; }
.tree .nm { font-family: var(--mono); font-size: 11.5px; }
.tree .isr .nm { font-weight: 500; }
.tree .t { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-left: auto; }
.tree .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tree .instbar { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); padding: 0 4px 2px 20px; font-family: var(--mono); }
.tree .instbar button { font-size: 10px; padding: 0 5px; line-height: 15px; }
.b { display: inline-block; font-size: 10px; line-height: 14px; padding: 0 4px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); font-family: var(--mono); }
.b.r { border-color: var(--read); color: var(--read); }
.b.w { border-color: var(--write); color: var(--write); }
.b.x { border-color: var(--critical); color: var(--critical); font-weight: 500; }
.b.ok { border-color: var(--good); color: var(--good); }
.b.ext { opacity: .7; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
table.t { border-collapse: collapse; width: 100%; font-size: 11.5px; margin-top: 6px; }
table.t th { text-align: left; color: var(--muted); font-weight: 500; padding: 2px 6px 2px 0; border-bottom: 1px solid var(--line); }
table.t td { padding: 2px 6px 2px 0; border-bottom: 1px solid var(--line); font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.viol td { color: var(--critical); }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--panel); color: var(--fg); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 9px; font-size: 12px; max-width: 380px; box-shadow: 0 4px 16px rgba(0,0,0,.18); display: none; }
#tip .mono { display: block; }
#tip .m { color: var(--muted); }
/* nested structure diagrams (SW structure on top, HW structure at the bottom): pan / zoom SVG */
.diagram { position: relative; overflow: hidden; height: 240px; min-height: 120px; padding: 0 !important; cursor: grab; user-select: none; background: var(--panel); border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; }
.diagram.dragging { cursor: grabbing; }
.diagram svg { display: block; width: 100%; height: 100%; font-family: var(--sans); }
.diagram text { fill: var(--fg); pointer-events: none; }
.diagram .nd rect.bx { fill: var(--panel-2); stroke: var(--line-strong); stroke-width: 1; cursor: pointer; }
.diagram .nd.k-subsystem > rect.bx, .diagram .nd.k-chain > rect.bx, .diagram .nd.k-group > rect.bx, .diagram .nd.k-shared_memory > rect.bx { fill: var(--panel); }
.diagram .nd.k-struct > rect.bx, .diagram .nd.k-variable > rect.bx, .diagram .nd.k-table > rect.bx, .diagram .nd.k-class > rect.bx { rx: 10; }
.diagram .nd.implicit > rect.bx { stroke-dasharray: 4 3; }
.diagram .nd > text.ttl { font-weight: 600; font-size: 12px; }
.diagram .nd.d0 > text.ttl { font-size: 13px; }
.diagram .nd.d2 > text.ttl { font-size: 11.5px; }
.diagram .nd > text.sub { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
.diagram .nd > text.cnt { font-family: var(--mono); font-size: 11px; font-weight: 600; text-anchor: end; }
.diagram .nd.dim > rect.bx { opacity: .45; }
.diagram .nd.dim > text { opacity: .45; }
.diagram .nd.rel-x > rect.bx { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
.diagram .nd.rel-r > rect.bx { stroke: var(--read); stroke-width: 2; }
.diagram .nd.rel-w > rect.bx { stroke: var(--write); stroke-width: 2; }
.diagram .nd.rel-rw > rect.bx { stroke: var(--write); stroke-width: 2.4; stroke-dasharray: 6 3; }
.diagram .nd.rel-c > rect.bx { stroke: var(--accent); stroke-width: 1.6; }
.diagram .nd.rel-miss > rect.bx { stroke: var(--critical); stroke-width: 2.4; }
.diagram .nd.sel > rect.bx { stroke: var(--accent); stroke-width: 2.6; fill: var(--accent-soft); }
.diagram .nd.shared > rect.bx { stroke: var(--warn); }
.diagram .it rect { fill: transparent; cursor: pointer; }
.diagram .it:hover rect { fill: var(--accent-soft); }
.diagram .it text { font-family: var(--mono); font-size: 11px; }
.diagram .it.rel rect { fill: var(--accent-soft); }
.diagram .it.rel-r text, .diagram .it.rel-w text, .diagram .it.rel-rw text { font-weight: 600; }
.diagram .it.sel rect { fill: var(--accent-soft); stroke: var(--accent); }
.diagram .it.dim { opacity: .4; }
.diagram .it.hot text { fill: var(--fg); font-weight: 600; }
.diagram .it.miss text { fill: var(--critical); font-weight: 600; }
.diagram .ed { fill: none; stroke: var(--line-strong); stroke-width: 1; opacity: .7; }
.diagram .ed.rel { stroke: var(--accent); stroke-width: 1.5; opacity: 1; }
.diagram .ed.dim { opacity: .18; }
.diagram .ed.k-upcall { stroke: var(--critical); stroke-dasharray: 5 3; }
.diagram .ed.k-ipc { stroke: var(--accent); stroke-dasharray: 2 3; }
.diagram .ed.k-produces, .diagram .ed.k-writes { stroke: var(--write); }
.diagram .ed.k-consumes, .diagram .ed.k-reads { stroke: var(--read); }
.diagram .ed.k-dma, .diagram .ed.k-control { stroke-dasharray: 4 3; }
.diagram .edl { font-size: 10px; font-family: var(--mono); fill: var(--muted); }
.diagram .edl.dim { opacity: .2; }
.diagram .reg { font-family: var(--mono); font-size: 10px; }
.diagram .reg rect { fill: var(--panel); stroke: var(--line); }
.diagram .reg.hot rect { stroke: var(--line-strong); fill: var(--accent-soft); }
.diagram .reg.miss rect { stroke: var(--critical); }
.diagram .reg.r text { fill: var(--read); } .diagram .reg.w text { fill: var(--write); }
.diagram .empty { padding: 14px; color: var(--muted); font-size: 12px; }
.pz { margin-left: auto; display: inline-flex; gap: 4px; }
.pz .tog { font-size: 11px; padding: 1px 7px; }
.tog.num { width: 48px; text-align: center; }

/* checkbox groups, ISR popover, slot inputs */
.checks { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; }
.checks.col { flex-direction: column; gap: 2px; }
.checks label { display: inline-flex; align-items: center; gap: 4px; text-transform: none; letter-spacing: 0; font-size: 11.5px; color: var(--fg); cursor: pointer; white-space: nowrap; }
.checks input { accent-color: var(--accent); margin: 0; }
.checks .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.checks .dash, label.chk .dash { width: 14px; height: 0; border-top: 2px dashed currentColor; display: inline-block; background: none !important; }
label.chk { display: inline-flex; align-items: center; gap: 4px; text-transform: none; letter-spacing: 0; font-size: 11.5px; color: var(--fg); cursor: pointer; }
label.chk input { accent-color: var(--accent); margin: 0; }
#legend .dash { display: inline-block; width: 14px; height: 0; border-top: 2px dashed currentColor; margin-right: 4px; vertical-align: 3px; }
.tog.mini { padding: 1px 6px; font-size: 11px; }
.dd { position: relative; }
.dd > summary { list-style: none; }
.dd > summary::-webkit-details-marker { display: none; }
.dd-body { position: absolute; z-index: 15; top: calc(100% + 4px); left: 0; min-width: 260px; max-height: 360px; overflow: auto; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.dd-tools { display: flex; gap: 6px; margin-bottom: 6px; }
.dd-tools input { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; background: var(--panel-2); }
.dd .core-h { font-size: 11px; color: var(--muted); margin: 6px 0 2px; text-transform: uppercase; letter-spacing: .04em; display: flex; gap: 6px; align-items: center; }
/* resizable windows: handle at the bottom edge of every panel body, splitter for the side column */
.panel .body { position: relative; }
.rz { height: 9px; margin: 1px 10px 3px; border-radius: 4px; cursor: ns-resize; display: flex; align-items: center; justify-content: center; touch-action: none; }
.rz i { display: block; width: 44px; height: 3px; border-radius: 2px; background: var(--line-strong); }
.rz:hover, .rz.on { background: var(--accent-soft); }
.rz:hover i, .rz.on i { background: var(--accent); }
#splitter { cursor: ew-resize; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; touch-action: none; align-self: stretch; }
#splitter i { display: block; width: 2px; height: 40px; border-radius: 1px; background: var(--line-strong); }
#splitter:hover, #splitter.on { background: var(--accent-soft); border-color: var(--accent); } #splitter:hover i, #splitter.on i { background: var(--accent); }
@media (max-width: 1000px) { #splitter { display: none; } }
#tree, #detail { max-height: none; }

.cgnav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 4px 0 2px; }
.cgnav .tog.mini:disabled { opacity: .4; cursor: default; }
.crumbs { margin-top: 2px; } .crumb { cursor: pointer; color: var(--accent); } .crumb:hover { text-decoration: underline; }
/* Details: collapsible relation sections with the SW / HW hierarchy */
.rel-head { font-weight: 600; margin-top: 8px; font-size: 12px; }
.muted { color: var(--muted); font-size: 11.5px; }
details.sub { border: 1px solid var(--line); border-radius: 6px; margin-top: 6px; background: var(--panel-2); }
details.sub > summary { cursor: pointer; padding: 3px 8px; font-weight: 600; font-size: 12px; list-style: none; display: flex; align-items: center; gap: 8px; }
details.sub > summary::-webkit-details-marker { display: none; }
details.sub > summary::before { content: "▸"; color: var(--muted); font-size: 10px; }
details.sub[open] > summary::before { content: "▾"; }
details.sub > summary .cnt { margin-left: auto; font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--muted); }
details.sub .sub-body { padding: 2px 6px 6px; background: var(--panel); border-top: 1px solid var(--line); border-radius: 0 0 6px 6px; }
.rel-row { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 4px; font-size: 11.5px; cursor: pointer; white-space: nowrap; overflow: hidden; }
.rel-row:hover { background: var(--accent-soft); }
.rel-row .tw { width: 10px; color: var(--muted); font-size: 10px; flex: none; }
.rel-row .nm { font-weight: 500; }
.rel-row.anc .nm { font-weight: 400; color: var(--muted); }
.rel-row .kd { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.rel-row .by { font-family: var(--mono); font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.rel-row.x .nm { color: var(--accent); } .rel-row.r .nm { color: var(--read); } .rel-row.w .nm { color: var(--write); } .rel-row.miss .nm { color: var(--critical); }
.rel-row .b.x { border-color: var(--accent); color: var(--accent); }
.rel-regs { display: flex; flex-wrap: wrap; gap: 3px; padding-bottom: 3px; }
.rel-regs .reg { font-family: var(--mono); font-size: 10.5px; padding: 0 5px; border: 1px solid var(--line); border-radius: 3px; color: var(--fg); }
.rel-regs .reg i { font-style: normal; color: var(--muted); margin-left: 4px; }
.rel-regs .reg.miss { border-color: var(--critical); color: var(--critical); }
.fnlist { line-height: 1.9; font-size: 11.5px; } .fnlist .fnb { cursor: pointer; }
/* Structure tab */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile .v { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.tile .l { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
.tile.bad .v { color: var(--critical); }
.tile.ok .v { color: var(--good); }
.tile .s { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.dsm-wrap { overflow-x: auto; padding-bottom: 6px; }
table.dsm { border-collapse: collapse; font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
table.dsm th, table.dsm td { border: 1px solid var(--line); padding: 0; height: 22px; min-width: 22px; text-align: center; }
table.dsm th.rh { text-align: left; padding: 0 8px 0 6px; white-space: nowrap; font-weight: 400; position: sticky; left: 0; background: var(--panel); z-index: 1; }
table.dsm th.rh .lv { display: inline-block; width: 16px; color: var(--muted); }
table.dsm th.rh .ly { color: var(--muted); font-size: 10px; margin-left: 6px; }
table.dsm th.rh.rel { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
table.dsm th.ch { height: 120px; vertical-align: bottom; padding: 4px 2px; font-weight: 400; }
table.dsm th.ch span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; display: inline-block; max-height: 112px; overflow: hidden; }
table.dsm th.mod { cursor: pointer; font-weight: 600; background: var(--panel-2); }
table.dsm th.mod .car { color: var(--muted); margin-right: 4px; }
table.dsm td.d { background: var(--panel-2); }
